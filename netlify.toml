[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The widget bundle is fetched fresh: revalidate every load (cheap 304s via
# ETag) so a deploy propagates in seconds, not up to a day. The old 24h max-age
# on this fixed path left stale copies live on edges/browsers after each deploy.
[[headers]]
  for = "/widget/v1/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# /book/:token → the standalone single-course booking page (token read from path).
[[redirects]]
  from = "/book/*"
  to = "/book/index.html"
  status = 200

# Stripe return pages for undated item purchases (create-checkout-session sends
# buyers to the extensionless paths, with ?session_id= on success).
[[redirects]]
  from = "/shop/success"
  to = "/shop/success/index.html"
  status = 200

[[redirects]]
  from = "/shop/cancelled"
  to = "/shop/cancelled/index.html"
  status = 200
