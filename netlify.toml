[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The widget bundle is served from a versioned, immutable path.
[[headers]]
  for = "/widget/v1/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

# /book/:token → the standalone single-course booking page (token read from path).
[[redirects]]
  from = "/book/*"
  to = "/book/index.html"
  status = 200
